name: Tests

on:
  push:
    branches: [main, "preview/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Design checks, analyzer & wiring tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Syntax-check all first-party scripts
        run: node --check assets/js/*.js

      # The four design checks, one step each so a failure names itself in the
      # log rather than hiding inside a compound command. None of them can see
      # the rendered page: a green run means nothing is structurally broken,
      # not that the page looks right.
      - name: Check design tokens
        run: python3 .github/scripts/check-tokens.py

      - name: Check colour contrast
        run: python3 .github/scripts/check-contrast.py

      - name: Check every class resolves to a rule
        run: python3 .github/scripts/check-classes.py

      - name: Check the migration analyzer
        run: node .github/scripts/test-analyzer.js

      # Dependency-free suite (node:test) — analyzer regressions for every
      # source module, semantic conversion cases, and page↔engine↔module
      # wiring checks. Lives on the branches that ship a second migration
      # tool; `node --test` exits 0 where there is no test/ directory, so this
      # file stays identical across main and the preview branches.
      - name: Run the test suite
        run: node --test
